<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>앱 아이콘 시안 20</title>

</head>
<body>


<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
body{margin:0;background:#F4F6FA}
a{color:#1D4ED8}a:hover{color:#1E40AF}
</style>

<div style="width: 1400px; height: 1320px; box-sizing: border-box; background: #F4F6FA; color: #111827; font-family: 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif; padding: 56px 64px; display: flex; flex-direction: column; gap: 40px; word-break: keep-all">

  <div style="display: flex; align-items: baseline; justify-content: space-between">
    <h1 style="margin: 0; font-size: 36px; font-weight: 700">앱 아이콘 시안 20</h1>
    <p style="margin: 0; font-size: 20px; color: #525C6B">Android 적응형 아이콘 기준 · 파랑 #2563EB · 선 굵기 7/100</p>
  </div>

  <div style="display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 40px 48px">

    <figure style="margin: 0; display: flex; flex-direction: column; align-items: center; gap: 16px">
      <svg width="200" height="200" viewBox="0 0 100 100" role="img" aria-label="핀 안에 포크" style="border-radius: 44px; background: #2563EB"><g fill="none" stroke="#FFFFFF" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"><path d="M50 88C50 88 22 60 22 41a28 28 0 1 1 56 0C78 60 50 88 50 88Z"/><path d="M42 24v9M50 24v9M58 24v9"/><path d="M42 33a8 8 0 0 0 16 0"/><path d="M50 41v16"/></g></svg>
      <figcaption style="font-size: 20px; color: #374151"><b style="color: #111827">01</b> 핀 + 포크</figcaption>
    </figure>

    <figure style="margin: 0; display: flex; flex-direction: column; align-items: center; gap: 16px">
      <svg width="200" height="200" viewBox="0 0 100 100" role="img" aria-label="말풍선 핀" style="border-radius: 44px; background: #FFFFFF; outline: 2px solid #DCE1EA; outline-offset: -2px"><g fill="none" stroke="#2563EB" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"><path d="M50 86 38 66H32a12 12 0 0 1-12-12V28a12 12 0 0 1 12-12h36a12 12 0 0 1 12 12v26a12 12 0 0 1-12 12h-6Z"/></g><g fill="#2563EB"><circle cx="36" cy="41" r="4.5"/><circle cx="50" cy="41" r="4.5"/><circle cx="64" cy="41" r="4.5"/></g></svg>
      <figcaption style="font-size: 20px; color: #374151"><b style="color: #111827">02</b> 말풍선 핀</figcaption>
    </figure>

    <figure style="margin: 0; display: flex; flex-direction: column; align-items: center; gap: 16px">
      <svg width="200" height="200" viewBox="0 0 100 100" role="img" aria-label="마이크와 위치점" style="border-radius: 44px; background: #0B0F17"><g fill="none" stroke="#4F8DFF" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"><rect x="38" y="14" width="24" height="40" rx="12"/><path d="M26 44a24 24 0 0 0 48 0"/><path d="M50 68v10"/><path d="M30 86h40"/></g></svg>
      <figcaption style="font-size: 20px; color: #374151"><b style="color: #111827">03</b> 마이크</figcaption>
    </figure>

    <figure style="margin: 0; display: flex; flex-direction: column; align-items: center; gap: 16px">
      <svg width="200" height="200" viewBox="0 0 100 100" role="img" aria-label="북마크 안에 위치점" style="border-radius: 44px; background: #2563EB"><g fill="none" stroke="#FFFFFF" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"><path d="M28 16h44v70L50 70 28 86Z"/><circle cx="50" cy="40" r="9"/></g></svg>
      <figcaption style="font-size: 20px; color: #374151"><b style="color: #111827">04</b> 북마크 핀</figcaption>
    </figure>

    <figure style="margin: 0; display: flex; flex-direction: column; align-items: center; gap: 16px">
      <svg width="200" height="200" viewBox="0 0 100 100" role="img" aria-label="길 위의 핀" style="border-radius: 44px; background: #FFFFFF; outline: 2px solid #DCE1EA; outline-offset: -2px"><g fill="none" stroke="#2563EB" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"><path d="M16 86C34 70 30 56 46 50s26-8 20-26" stroke-dasharray="1 14"/><path d="M70 50C70 50 54 36 54 26a16 16 0 1 1 32 0c0 10-16 24-16 24Z"/></g><circle cx="70" cy="26" r="5" fill="#2563EB"/></svg>
      <figcaption style="font-size: 20px; color: #374151"><b style="color: #111827">05</b> 지나온 길</figcaption>
    </figure>

    <figure style="margin: 0; display: flex; flex-direction: column; align-items: center; gap: 16px">
      <svg width="200" height="200" viewBox="0 0 100 100" role="img" aria-label="핀 안에 하트" style="border-radius: 44px; background: #2563EB"><g fill="none" stroke="#FFFFFF" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"><path d="M50 88C50 88 22 60 22 41a28 28 0 1 1 56 0C78 60 50 88 50 88Z"/><path d="M50 54c-9-6-14-11-14-17a7 7 0 0 1 14-2 7 7 0 0 1 14 2c0 6-5 11-14 17Z"/></g></svg>
      <figcaption style="font-size: 20px; color: #374151"><b style="color: #111827">06</b> 핀 + 하트</figcaption>
    </figure>

    <figure style="margin: 0; display: flex; flex-direction: column; align-items: center; gap: 16px">
      <svg width="200" height="200" viewBox="0 0 100 100" role="img" aria-label="숟가락과 젓가락" style="border-radius: 44px; background: #0B0F17"><g fill="none" stroke="#4F8DFF" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="34" cy="30" rx="11" ry="15"/><path d="M34 45v39"/><path d="M60 16 66 84M72 16 66 84"/></g></svg>
      <figcaption style="font-size: 20px; color: #374151"><b style="color: #111827">07</b> 수저</figcaption>
    </figure>

    <figure style="margin: 0; display: flex; flex-direction: column; align-items: center; gap: 16px">
      <svg width="200" height="200" viewBox="0 0 100 100" role="img" aria-label="접시 위 위치점" style="border-radius: 44px; background: #2563EB"><g fill="none" stroke="#FFFFFF" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"><circle cx="50" cy="50" r="34"/><circle cx="50" cy="50" r="19"/></g><circle cx="50" cy="50" r="6" fill="#FFFFFF"/></svg>
      <figcaption style="font-size: 20px; color: #374151"><b style="color: #111827">08</b> 접시</figcaption>
    </figure>

    <figure style="margin: 0; display: flex; flex-direction: column; align-items: center; gap: 16px">
      <svg width="200" height="200" viewBox="0 0 100 100" role="img" aria-label="말풍선 안에 포크" style="border-radius: 44px; background: #FFFFFF; outline: 2px solid #DCE1EA; outline-offset: -2px"><g fill="none" stroke="#2563EB" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"><path d="M50 86 38 66H32a12 12 0 0 1-12-12V28a12 12 0 0 1 12-12h36a12 12 0 0 1 12 12v26a12 12 0 0 1-12 12h-6Z"/><path d="M42 26v8M50 26v8M58 26v8"/><path d="M42 34a8 8 0 0 0 16 0"/><path d="M50 42v14"/></g></svg>
      <figcaption style="font-size: 20px; color: #374151"><b style="color: #111827">09</b> 말풍선 + 포크</figcaption>
    </figure>

    <figure style="margin: 0; display: flex; flex-direction: column; align-items: center; gap: 16px">
      <svg width="200" height="200" viewBox="0 0 100 100" role="img" aria-label="되돌아오는 화살표와 위치점" style="border-radius: 44px; background: #2563EB"><g fill="none" stroke="#FFFFFF" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"><path d="M74 38A28 28 0 1 0 78 58"/><path d="M62 40h14V26"/></g><circle cx="50" cy="50" r="8" fill="#FFFFFF"/></svg>
      <figcaption style="font-size: 20px; color: #374151"><b style="color: #111827">10</b> 다시 오기</figcaption>
    </figure>

    <figure style="margin: 0; display: flex; flex-direction: column; align-items: center; gap: 16px">
      <svg width="200" height="200" viewBox="0 0 100 100" role="img" aria-label="핀 안에 시계" style="border-radius: 44px; background: #0B0F17"><g fill="none" stroke="#4F8DFF" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"><path d="M50 88C50 88 22 60 22 41a28 28 0 1 1 56 0C78 60 50 88 50 88Z"/><path d="M50 28v14l9 6"/></g></svg>
      <figcaption style="font-size: 20px; color: #374151"><b style="color: #111827">11</b> 나중에</figcaption>
    </figure>

    <figure style="margin: 0; display: flex; flex-direction: column; align-items: center; gap: 16px">
      <svg width="200" height="200" viewBox="0 0 100 100" role="img" aria-label="핀 두 개" style="border-radius: 44px; background: #2563EB"><g fill="none" stroke="#FFFFFF" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"><path d="M30 60C30 60 14 44 14 34a16 16 0 1 1 32 0c0 10-16 26-16 26Z" opacity="0.5"/><path d="M62 88C62 88 36 62 36 43a26 26 0 1 1 52 0C88 62 62 88 62 88Z"/><circle cx="62" cy="43" r="8"/></g></svg>
      <figcaption style="font-size: 20px; color: #374151"><b style="color: #111827">12</b> 지난 곳, 다음 곳</figcaption>
    </figure>

    <figure style="margin: 0; display: flex; flex-direction: column; align-items: center; gap: 16px">
      <svg width="200" height="200" viewBox="0 0 100 100" role="img" aria-label="자동차 위의 핀" style="border-radius: 44px; background: #FFFFFF; outline: 2px solid #DCE1EA; outline-offset: -2px"><g fill="none" stroke="#2563EB" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"><path d="M18 74V60l8-14h40l14 14v14"/><path d="M14 74h72"/><circle cx="32" cy="78" r="7"/><circle cx="68" cy="78" r="7"/><path d="M50 40C50 40 38 29 38 22a12 12 0 1 1 24 0c0 7-12 18-12 18Z"/></g></svg>
      <figcaption style="font-size: 20px; color: #374151"><b style="color: #111827">13</b> 차 + 핀</figcaption>
    </figure>

    <figure style="margin: 0; display: flex; flex-direction: column; align-items: center; gap: 16px">
      <svg width="200" height="200" viewBox="0 0 100 100" role="img" aria-label="접힌 지도와 핀" style="border-radius: 44px; background: #2563EB"><g fill="none" stroke="#FFFFFF" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"><path d="M16 30 38 22l24 8 22-8v48l-22 8-24-8-22 8Z"/><path d="M38 22v48M62 30v48"/></g></svg>
      <figcaption style="font-size: 20px; color: #374151"><b style="color: #111827">14</b> 지도</figcaption>
    </figure>

    <figure style="margin: 0; display: flex; flex-direction: column; align-items: center; gap: 16px">
      <svg width="200" height="200" viewBox="0 0 100 100" role="img" aria-label="핀 안에 ㄷ 글자" style="border-radius: 44px; background: #0B0F17"><g fill="none" stroke="#4F8DFF" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"><path d="M50 88C50 88 22 60 22 41a28 28 0 1 1 56 0C78 60 50 88 50 88Z"/><path d="M60 30H40v22h20"/></g></svg>
      <figcaption style="font-size: 20px; color: #374151"><b style="color: #111827">15</b> 핀 + ㄷ</figcaption>
    </figure>

    <figure style="margin: 0; display: flex; flex-direction: column; align-items: center; gap: 16px">
      <svg width="200" height="200" viewBox="0 0 100 100" role="img" aria-label="깃발 안에 점" style="border-radius: 44px; background: #2563EB"><g fill="none" stroke="#FFFFFF" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"><path d="M28 88V14"/><path d="M28 18h44l-10 15 10 15H28"/><circle cx="48" cy="33" r="6"/></g></svg>
      <figcaption style="font-size: 20px; color: #374151"><b style="color: #111827">16</b> 깃발 + 점</figcaption>
    </figure>

    <figure style="margin: 0; display: flex; flex-direction: column; align-items: center; gap: 16px">
      <svg width="200" height="200" viewBox="0 0 100 100" role="img" aria-label="점선 궤적 끝의 핀" style="border-radius: 44px; background: #FFFFFF; outline: 2px solid #DCE1EA; outline-offset: -2px"><g fill="none" stroke="#2563EB" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"><path d="M16 84Q44 80 50 58" stroke-dasharray="0.1 13"/><path d="M64 60C64 60 42 40 42 26a22 22 0 1 1 44 0c0 14-22 34-22 34Z"/><circle cx="64" cy="26" r="7"/></g></svg>
      <figcaption style="font-size: 20px; color: #374151"><b style="color: #111827">17</b> 궤적 + 핀</figcaption>
    </figure>

    <figure style="margin: 0; display: flex; flex-direction: column; align-items: center; gap: 16px">
      <svg width="200" height="200" viewBox="0 0 100 100" role="img" aria-label="핀 안에 별" style="border-radius: 44px; background: #2563EB"><g fill="none" stroke="#FFFFFF" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"><path d="M50 88C50 88 22 60 22 41a28 28 0 1 1 56 0C78 60 50 88 50 88Z"/><path d="m50 26 4.5 9.5 10 1.5-7.3 7 1.8 10L50 49l-9 5 1.8-10-7.3-7 10-1.5Z"/></g></svg>
      <figcaption style="font-size: 20px; color: #374151"><b style="color: #111827">18</b> 핀 + 별</figcaption>
    </figure>

    <figure style="margin: 0; display: flex; flex-direction: column; align-items: center; gap: 16px">
      <svg width="200" height="200" viewBox="0 0 100 100" role="img" aria-label="메모 카드와 위치점" style="border-radius: 44px; background: #0B0F17"><g fill="none" stroke="#4F8DFF" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"><rect x="18" y="22" width="64" height="56" rx="12"/><path d="M48 42h20M48 58h12"/><circle cx="34" cy="42" r="5"/><path d="M34 47v9"/></g></svg>
      <figcaption style="font-size: 20px; color: #374151"><b style="color: #111827">19</b> 메모 카드</figcaption>
    </figure>

    <figure style="margin: 0; display: flex; flex-direction: column; align-items: center; gap: 16px">
      <svg width="200" height="200" viewBox="0 0 100 100" role="img" aria-label="그릇과 김" style="border-radius: 44px; background: #2563EB"><g fill="none" stroke="#FFFFFF" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"><path d="M18 50h64a32 32 0 0 1-64 0Z"/><path d="M34 80h32"/><path d="M40 36c0-6 4-6 4-12M56 36c0-6 4-6 4-12"/></g></svg>
      <figcaption style="font-size: 20px; color: #374151"><b style="color: #111827">20</b> 그릇</figcaption>
    </figure>

  </div>

  <p style="margin: auto 0 0; font-size: 20px; color: #525C6B">배경 세 가지(파랑 / 흰색 / 짙은 남색)는 같은 도안을 다른 배경에 올렸을 때의 느낌을 보기 위한 것이다. 도안이 정해지면 배경은 따로 고른다.</p>
</div>


</body>
</html>
