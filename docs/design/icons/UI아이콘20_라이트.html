<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>UI 아이콘 20 라이트</title>

</head>
<body>


<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
body{margin:0;background:#F4F6FA}
a{color:#1D4ED8}a:hover{color:#1E40AF}
</style>

<div style="width: 1400px; height: 760px; box-sizing: border-box; background: #F4F6FA; color: #111827; font-family: 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif; padding: 48px 64px; display: flex; flex-direction: column; gap: 32px; word-break: keep-all">

  <div style="display: flex; align-items: baseline; justify-content: space-between">
    <h1 style="margin: 0; font-size: 32px; font-weight: 700">UI 아이콘 20 · 라이트</h1>
    <p style="margin: 0; font-size: 20px; color: #525C6B">24 격자 · 선 2 · 둥근 끝 · 표시 크기 40~48dp</p>
  </div>

  <div style="display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 28px 32px">

    <figure style="margin: 0; display: flex; align-items: center; gap: 20px; height: 104px; padding: 0 24px; border-radius: 20px; background: #FFFFFF; border: 2px solid #DCE1EA; box-sizing: border-box">
      <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="#1F2937" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" role="img" aria-label="말하기"><path d="M12 15a4 4 0 0 0 4-4V6a4 4 0 1 0-8 0v5a4 4 0 0 0 4 4Z"/><path d="M19 11a7 7 0 0 1-14 0"/><path d="M12 18v3"/></svg>
      <figcaption style="display: flex; flex-direction: column; gap: 2px"><span style="font-size: 22px; font-weight: 600">말하기</span><span style="font-size: 16px; color: #525C6B">mic</span></figcaption>
    </figure>

    <figure style="margin: 0; display: flex; align-items: center; gap: 20px; height: 104px; padding: 0 24px; border-radius: 20px; background: #FFFFFF; border: 2px solid #DCE1EA; box-sizing: border-box">
      <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="#1F2937" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" role="img" aria-label="취소"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
      <figcaption style="display: flex; flex-direction: column; gap: 2px"><span style="font-size: 22px; font-weight: 600">취소 · 닫기</span><span style="font-size: 16px; color: #525C6B">close</span></figcaption>
    </figure>

    <figure style="margin: 0; display: flex; align-items: center; gap: 20px; height: 104px; padding: 0 24px; border-radius: 20px; background: #FFFFFF; border: 2px solid #DCE1EA; box-sizing: border-box">
      <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="#1F2937" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" role="img" aria-label="뒤로"><path d="m15 5-7 7 7 7"/></svg>
      <figcaption style="display: flex; flex-direction: column; gap: 2px"><span style="font-size: 22px; font-weight: 600">뒤로</span><span style="font-size: 16px; color: #525C6B">back</span></figcaption>
    </figure>

    <figure style="margin: 0; display: flex; align-items: center; gap: 20px; height: 104px; padding: 0 24px; border-radius: 20px; background: #FFFFFF; border: 2px solid #DCE1EA; box-sizing: border-box">
      <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="#1F2937" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" role="img" aria-label="더 보기"><path d="m9 5 7 7-7 7"/></svg>
      <figcaption style="display: flex; flex-direction: column; gap: 2px"><span style="font-size: 22px; font-weight: 600">더 보기</span><span style="font-size: 16px; color: #525C6B">chevron</span></figcaption>
    </figure>

    <figure style="margin: 0; display: flex; align-items: center; gap: 20px; height: 104px; padding: 0 24px; border-radius: 20px; background: #FFFFFF; border: 2px solid #DCE1EA; box-sizing: border-box">
      <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="#1F2937" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" role="img" aria-label="설정"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1Z"/></svg>
      <figcaption style="display: flex; flex-direction: column; gap: 2px"><span style="font-size: 22px; font-weight: 600">설정</span><span style="font-size: 16px; color: #525C6B">settings</span></figcaption>
    </figure>

    <figure style="margin: 0; display: flex; align-items: center; gap: 20px; height: 104px; padding: 0 24px; border-radius: 20px; background: #FFFFFF; border: 2px solid #DCE1EA; box-sizing: border-box">
      <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="#1F2937" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" role="img" aria-label="뭐 먹을까"><path d="M3 2v7c0 1.1.9 2 2 2h4a2 2 0 0 0 2-2V2"/><path d="M7 2v20"/><path d="M21 15V2a5 5 0 0 0-5 5v6c0 1.1.9 2 2 2h3Zm0 0v7"/></svg>
      <figcaption style="display: flex; flex-direction: column; gap: 2px"><span style="font-size: 22px; font-weight: 600">뭐 먹을까</span><span style="font-size: 16px; color: #525C6B">utensils</span></figcaption>
    </figure>

    <figure style="margin: 0; display: flex; align-items: center; gap: 20px; height: 104px; padding: 0 24px; border-radius: 20px; background: #FFFFFF; border: 2px solid #DCE1EA; box-sizing: border-box">
      <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="#1F2937" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" role="img" aria-label="내 맛집 목록"><path d="M8 6h13"/><path d="M8 12h13"/><path d="M8 18h13"/><path d="M3 6h.01"/><path d="M3 12h.01"/><path d="M3 18h.01"/></svg>
      <figcaption style="display: flex; flex-direction: column; gap: 2px"><span style="font-size: 22px; font-weight: 600">목록</span><span style="font-size: 16px; color: #525C6B">list</span></figcaption>
    </figure>

    <figure style="margin: 0; display: flex; align-items: center; gap: 20px; height: 104px; padding: 0 24px; border-radius: 20px; background: #FFFFFF; border: 2px solid #DCE1EA; box-sizing: border-box">
      <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="#1F2937" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" role="img" aria-label="가게 위치"><path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z"/><circle cx="12" cy="10" r="3"/></svg>
      <figcaption style="display: flex; flex-direction: column; gap: 2px"><span style="font-size: 22px; font-weight: 600">가게 · 위치</span><span style="font-size: 16px; color: #525C6B">map-pin</span></figcaption>
    </figure>

    <figure style="margin: 0; display: flex; align-items: center; gap: 20px; height: 104px; padding: 0 24px; border-radius: 20px; background: #FFFFFF; border: 2px solid #DCE1EA; box-sizing: border-box">
      <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="#1F2937" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" role="img" aria-label="지도"><path d="M3 7 9 5l6 2 6-2v12l-6 2-6-2-6 2Z"/><path d="M9 5v12M15 7v12"/></svg>
      <figcaption style="display: flex; flex-direction: column; gap: 2px"><span style="font-size: 22px; font-weight: 600">지도</span><span style="font-size: 16px; color: #525C6B">map</span></figcaption>
    </figure>

    <figure style="margin: 0; display: flex; align-items: center; gap: 20px; height: 104px; padding: 0 24px; border-radius: 20px; background: #FFFFFF; border: 2px solid #DCE1EA; box-sizing: border-box">
      <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="#1F2937" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" role="img" aria-label="안내 시작"><path d="m3 11 19-9-9 19-2-8Z"/></svg>
      <figcaption style="display: flex; flex-direction: column; gap: 2px"><span style="font-size: 22px; font-weight: 600">안내 시작</span><span style="font-size: 16px; color: #525C6B">navigation</span></figcaption>
    </figure>

    <figure style="margin: 0; display: flex; align-items: center; gap: 20px; height: 104px; padding: 0 24px; border-radius: 20px; background: #FFFFFF; border: 2px solid #DCE1EA; box-sizing: border-box">
      <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="#1F2937" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" role="img" aria-label="확인"><path d="m5 12 5 5L20 7"/></svg>
      <figcaption style="display: flex; flex-direction: column; gap: 2px"><span style="font-size: 22px; font-weight: 600">예 · 저장됨</span><span style="font-size: 16px; color: #525C6B">check</span></figcaption>
    </figure>

    <figure style="margin: 0; display: flex; align-items: center; gap: 20px; height: 104px; padding: 0 24px; border-radius: 20px; background: #FFFFFF; border: 2px solid #DCE1EA; box-sizing: border-box">
      <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="#1F2937" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" role="img" aria-label="공유"><path d="M4 12v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8"/><path d="m16 6-4-4-4 4"/><path d="M12 2v13"/></svg>
      <figcaption style="display: flex; flex-direction: column; gap: 2px"><span style="font-size: 22px; font-weight: 600">공유</span><span style="font-size: 16px; color: #525C6B">share</span></figcaption>
    </figure>

    <figure style="margin: 0; display: flex; align-items: center; gap: 20px; height: 104px; padding: 0 24px; border-radius: 20px; background: #FFFFFF; border: 2px solid #DCE1EA; box-sizing: border-box">
      <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="#1F2937" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" role="img" aria-label="수정"><path d="M17 3a2.8 2.8 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5Z"/></svg>
      <figcaption style="display: flex; flex-direction: column; gap: 2px"><span style="font-size: 22px; font-weight: 600">수정</span><span style="font-size: 16px; color: #525C6B">pencil</span></figcaption>
    </figure>

    <figure style="margin: 0; display: flex; align-items: center; gap: 20px; height: 104px; padding: 0 24px; border-radius: 20px; background: #FFFFFF; border: 2px solid #DCE1EA; box-sizing: border-box">
      <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="#B91C1C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" role="img" aria-label="삭제"><path d="M3 6h18"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>
      <figcaption style="display: flex; flex-direction: column; gap: 2px"><span style="font-size: 22px; font-weight: 600">삭제</span><span style="font-size: 16px; color: #525C6B">trash · 빨강만 허용</span></figcaption>
    </figure>

    <figure style="margin: 0; display: flex; align-items: center; gap: 20px; height: 104px; padding: 0 24px; border-radius: 20px; background: #FFFFFF; border: 2px solid #DCE1EA; box-sizing: border-box">
      <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="#1F2937" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" role="img" aria-label="검색"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
      <figcaption style="display: flex; flex-direction: column; gap: 2px"><span style="font-size: 22px; font-weight: 600">검색</span><span style="font-size: 16px; color: #525C6B">search</span></figcaption>
    </figure>

    <figure style="margin: 0; display: flex; align-items: center; gap: 20px; height: 104px; padding: 0 24px; border-radius: 20px; background: #FFFFFF; border: 2px solid #DCE1EA; box-sizing: border-box">
      <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="#1F2937" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" role="img" aria-label="주행 중"><path d="M5 17H3v-5l2-5h14l2 5v5h-2"/><circle cx="7.5" cy="17.5" r="2.5"/><circle cx="16.5" cy="17.5" r="2.5"/><path d="M5 12h14"/></svg>
      <figcaption style="display: flex; flex-direction: column; gap: 2px"><span style="font-size: 22px; font-weight: 600">주행 중</span><span style="font-size: 16px; color: #525C6B">car</span></figcaption>
    </figure>

    <figure style="margin: 0; display: flex; align-items: center; gap: 20px; height: 104px; padding: 0 24px; border-radius: 20px; background: #FFFFFF; border: 2px solid #DCE1EA; box-sizing: border-box">
      <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="#1F2937" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" role="img" aria-label="음량"><path d="M11 5 6 9H2v6h4l5 4Z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M19 5a9 9 0 0 1 0 14"/></svg>
      <figcaption style="display: flex; flex-direction: column; gap: 2px"><span style="font-size: 22px; font-weight: 600">음성 음량</span><span style="font-size: 16px; color: #525C6B">volume</span></figcaption>
    </figure>

    <figure style="margin: 0; display: flex; align-items: center; gap: 20px; height: 104px; padding: 0 24px; border-radius: 20px; background: #FFFFFF; border: 2px solid #DCE1EA; box-sizing: border-box">
      <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="#1F2937" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" role="img" aria-label="리마인드"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10 21a2 2 0 0 0 4 0"/></svg>
      <figcaption style="display: flex; flex-direction: column; gap: 2px"><span style="font-size: 22px; font-weight: 600">리마인드</span><span style="font-size: 16px; color: #525C6B">bell</span></figcaption>
    </figure>

    <figure style="margin: 0; display: flex; align-items: center; gap: 20px; height: 104px; padding: 0 24px; border-radius: 20px; background: #FFFFFF; border: 2px solid #DCE1EA; box-sizing: border-box">
      <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="#1F2937" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" role="img" aria-label="QR"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><path d="M14 14h3v3h-3zM20 14h1M14 20h1M18 18h3v3"/></svg>
      <figcaption style="display: flex; flex-direction: column; gap: 2px"><span style="font-size: 22px; font-weight: 600">QR</span><span style="font-size: 16px; color: #525C6B">qr-code</span></figcaption>
    </figure>

    <figure style="margin: 0; display: flex; align-items: center; gap: 20px; height: 104px; padding: 0 24px; border-radius: 20px; background: #FFFFFF; border: 2px solid #DCE1EA; box-sizing: border-box">
      <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="#1F2937" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" role="img" aria-label="저장 시각"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>
      <figcaption style="display: flex; flex-direction: column; gap: 2px"><span style="font-size: 22px; font-weight: 600">저장 시각</span><span style="font-size: 16px; color: #525C6B">clock</span></figcaption>
    </figure>

  </div>

  <p style="margin: auto 0 0; font-size: 18px; color: #525C6B">기본 색은 글자색과 같게 쓰고, 삭제만 빨강. 누를 수 있는 아이콘은 80×80dp 터치 영역 안에 둔다.</p>
</div>


</body>
</html>
