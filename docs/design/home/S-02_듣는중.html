<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>다음에 가게 듣는 중</title>

</head>
<body>


<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
body{margin:0;background:#0B0F17}
a{color:#4F8DFF}a:hover{color:#7FABFF}
button{font-family:inherit}
</style>

<div style="width: 1280px; height: 1080px; box-sizing: border-box; background: #0B0F17; color: #F3F5F8; font-family: 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif; display: flex; flex-direction: column; overflow: hidden; word-break: keep-all; position: relative">

  <header style="height: 96px; box-sizing: border-box; padding: 0 24px 0 40px; display: flex; align-items: center; gap: 20px; flex: none; opacity: 0.35">
    <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="#4F8DFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z"/><circle cx="12" cy="10" r="3"/></svg>
    <h1 style="margin: 0; font-size: 34px; font-weight: 700; letter-spacing: -0.01em; flex: 1">다음에 가게</h1>
  </header>

  <main style="flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 56px; padding: 0 48px 96px; box-sizing: border-box">
    <div style="display: flex; flex-direction: column; align-items: center; gap: 20px">
      <div aria-hidden="true" style="width: 200px; height: 200px; border-radius: 50%; background: #2563EB; display: flex; align-items: center; justify-content: center; color: #FFFFFF; box-shadow: 0 0 0 28px rgba(37,99,235,0.16), 0 0 0 64px rgba(37,99,235,0.07)">
        <svg width="96" height="96" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 15a4 4 0 0 0 4-4V6a4 4 0 1 0-8 0v5a4 4 0 0 0 4 4Z"/><path d="M19 11a7 7 0 0 1-14 0"/><path d="M12 18v3"/></svg>
      </div>
      <p role="status" style="margin: 32px 0 0; font-size: 36px; font-weight: 600; color: #A6B0C0">듣고 있어요</p>
    </div>

    <div aria-hidden="true" style="display: flex; align-items: center; gap: 12px; height: 120px">
      <i style="display: block; width: 14px; height: 28px; border-radius: 7px; background: #4F8DFF"></i>
      <i style="display: block; width: 14px; height: 56px; border-radius: 7px; background: #4F8DFF"></i>
      <i style="display: block; width: 14px; height: 96px; border-radius: 7px; background: #4F8DFF"></i>
      <i style="display: block; width: 14px; height: 120px; border-radius: 7px; background: #4F8DFF"></i>
      <i style="display: block; width: 14px; height: 80px; border-radius: 7px; background: #4F8DFF"></i>
      <i style="display: block; width: 14px; height: 44px; border-radius: 7px; background: #4F8DFF"></i>
      <i style="display: block; width: 14px; height: 104px; border-radius: 7px; background: #4F8DFF"></i>
      <i style="display: block; width: 14px; height: 72px; border-radius: 7px; background: #4F8DFF"></i>
      <i style="display: block; width: 14px; height: 36px; border-radius: 7px; background: #4F8DFF"></i>
      <i style="display: block; width: 14px; height: 88px; border-radius: 7px; background: #4F8DFF"></i>
      <i style="display: block; width: 14px; height: 112px; border-radius: 7px; background: #4F8DFF"></i>
      <i style="display: block; width: 14px; height: 60px; border-radius: 7px; background: #4F8DFF"></i>
      <i style="display: block; width: 14px; height: 32px; border-radius: 7px; background: #4F8DFF"></i>
      <i style="display: block; width: 14px; height: 76px; border-radius: 7px; background: #4F8DFF"></i>
      <i style="display: block; width: 14px; height: 100px; border-radius: 7px; background: #4F8DFF"></i>
      <i style="display: block; width: 14px; height: 52px; border-radius: 7px; background: #4F8DFF"></i>
      <i style="display: block; width: 14px; height: 24px; border-radius: 7px; background: #4F8DFF"></i>
    </div>

    <p style="margin: 0; max-width: 1000px; font-size: 48px; font-weight: 500; line-height: 1.4; text-align: center">방금 지난 빨간 간판 고깃집<span style="color: #6B7686">…</span></p>
  </main>

  <div style="position: absolute; left: 0; right: 0; bottom: 56px; display: flex; justify-content: center">
    <button type="button" style="height: 96px; padding: 0 48px; border-radius: 28px; border: 2px solid #3A4557; background: transparent; color: #C8D0DC; font-size: 32px; font-weight: 600; display: flex; align-items: center; gap: 16px; cursor: pointer">
      <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
      취소
    </button>
  </div>
</div>


</body>
</html>
