<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>다음에 가게 저장 완료</title>

</head>
<body>


<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
body{margin:0;background:#0B0F17}
a{color:#4F8DFF}a:hover{color:#7FABFF}
button{font-family:inherit}
</style>

<div style="width: 1280px; height: 1080px; box-sizing: border-box; background: #0B0F17; color: #F3F5F8; font-family: 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif; display: flex; flex-direction: column; overflow: hidden; word-break: keep-all; position: relative">

  <header style="height: 96px; box-sizing: border-box; padding: 0 24px 0 40px; display: flex; align-items: center; gap: 20px; flex: none">
    <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="#4F8DFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z"/><circle cx="12" cy="10" r="3"/></svg>
    <h1 style="margin: 0; font-size: 34px; font-weight: 700; letter-spacing: -0.01em; flex: 1">다음에 가게</h1>
    <div style="display: flex; align-items: center; gap: 12px; height: 56px; padding: 0 22px; border-radius: 28px; background: #121826; color: #A6B0C0; font-size: 24px">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="m3 11 19-9-9 19-2-8Z"/></svg>
      <span>강남대로 · 북쪽</span>
    </div>
    <button type="button" aria-label="설정" style="width: 80px; height: 80px; border: 0; border-radius: 24px; background: transparent; color: #C8D0DC; display: flex; align-items: center; justify-content: center; cursor: pointer">
      <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1Z"/></svg>
    </button>
  </header>

  <main style="flex: 1; display: grid; grid-template-columns: 600px minmax(0, 1fr); gap: 48px; padding: 24px 48px 48px; box-sizing: border-box; min-height: 0">
    <section aria-label="말하기" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 36px">
      <button type="button" aria-label="눌러서 말하기" style="width: 360px; height: 360px; border-radius: 50%; border: 0; background: #2563EB; color: #FFFFFF; display: flex; align-items: center; justify-content: center; cursor: pointer; box-shadow: 0 0 0 20px rgba(37,99,235,0.14), 0 0 0 44px rgba(37,99,235,0.06), 0 24px 60px rgba(37,99,235,0.35)">
        <svg width="168" height="168" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 15a4 4 0 0 0 4-4V6a4 4 0 1 0-8 0v5a4 4 0 0 0 4 4Z"/><path d="M19 11a7 7 0 0 1-14 0"/><path d="M12 18v3"/></svg>
      </button>
      <div style="display: flex; flex-direction: column; align-items: center; gap: 14px">
        <p style="margin: 0; font-size: 38px; font-weight: 600">눌러서 말하기</p>
        <p style="margin: 0; font-size: 26px; line-height: 1.5; color: #A6B0C0; text-align: center">“방금 지난 가게 저장해줘”<br>“뭐 먹을까”</p>
      </div>
    </section>

    <section aria-label="바로가기" style="display: flex; flex-direction: column; justify-content: center; gap: 24px; min-width: 0">
      <a href="#" style="display: flex; align-items: center; gap: 24px; height: 120px; padding: 0 36px; border-radius: 28px; background: #151B26; border: 2px solid #2C3646; color: #F3F5F8; text-decoration: none; box-sizing: border-box">
        <span style="width: 64px; height: 64px; border-radius: 20px; background: #1B2A45; color: #7FABFF; display: flex; align-items: center; justify-content: center; flex: none">
          <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 2v7c0 1.1.9 2 2 2h4a2 2 0 0 0 2-2V2"/><path d="M7 2v20"/><path d="M21 15V2a5 5 0 0 0-5 5v6c0 1.1.9 2 2 2h3Zm0 0v7"/></svg>
        </span>
        <span style="flex: 1; display: flex; flex-direction: column; gap: 4px; min-width: 0">
          <span style="font-size: 34px; font-weight: 600">뭐 먹을까</span>
          <span style="font-size: 24px; color: #A6B0C0">근처 저장 가게 중 3곳 추천</span>
        </span>
        <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#6B7686" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 5 7 7-7 7"/></svg>
      </a>

      <a href="#" style="display: flex; align-items: center; gap: 24px; height: 120px; padding: 0 36px; border-radius: 28px; background: #151B26; border: 2px solid #2C3646; color: #F3F5F8; text-decoration: none; box-sizing: border-box">
        <span style="width: 64px; height: 64px; border-radius: 20px; background: #1B2A45; color: #7FABFF; display: flex; align-items: center; justify-content: center; flex: none">
          <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z"/><circle cx="12" cy="10" r="3"/></svg>
        </span>
        <span style="flex: 1; display: flex; flex-direction: column; gap: 4px; min-width: 0">
          <span style="font-size: 34px; font-weight: 600">내 맛집</span>
          <span style="font-size: 24px; color: #A6B0C0">13곳 · 미확인 3곳</span>
        </span>
        <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#6B7686" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 5 7 7-7 7"/></svg>
      </a>

      <a href="#" aria-label="최근 저장 명품갈비" style="display: flex; flex-direction: column; gap: 20px; padding: 28px 36px 32px; border-radius: 28px; background: #10151F; border: 2px solid #1E2635; color: #F3F5F8; text-decoration: none; box-sizing: border-box">
        <span style="display: flex; align-items: center; justify-content: space-between">
          <span style="font-size: 24px; color: #A6B0C0">최근 저장 · 방금</span>
          <span style="display: inline-flex; align-items: center; height: 44px; padding: 0 18px; border-radius: 22px; border: 2px solid #15803D; color: #86EFAC; font-size: 22px; font-weight: 500">저장됨</span>
        </span>
        <span style="display: flex; align-items: center; gap: 20px">
          <span style="font-size: 36px; font-weight: 600; flex: 1">명품갈비</span>
          <span style="font-size: 24px; color: #A6B0C0">고깃집 · 120m 뒤</span>
        </span>
        <span style="font-size: 24px; color: #6B7686">서울 강남구 강남대로 123</span>
      </a>
    </section>
  </main>

  <div role="status" style="position: absolute; left: 140px; right: 140px; bottom: 64px; height: 128px; border-radius: 32px; background: #151B26; border: 2px solid #2C3646; box-shadow: 0 24px 60px rgba(0,0,0,0.55); display: flex; align-items: center; gap: 28px; padding: 0 44px; box-sizing: border-box">
    <span style="width: 64px; height: 64px; border-radius: 50%; background: #14532D; color: #86EFAC; display: flex; align-items: center; justify-content: center; flex: none">
      <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m5 12 5 5L20 7"/></svg>
    </span>
    <span style="flex: 1; font-size: 34px; font-weight: 600">저장했어요 · 명품갈비</span>
    <span style="font-size: 24px; color: #A6B0C0">근처에 오면 알려드릴게요</span>
  </div>
</div>


</body>
</html>
