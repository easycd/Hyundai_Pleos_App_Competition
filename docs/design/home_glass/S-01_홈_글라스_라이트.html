<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><title>다음에 가게 홈 · 리퀴드 글라스 · 라이트</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
body{margin:0;background:#F6EFEA}
.root{position:relative;width:1280px;height:1080px;overflow:hidden;background:#F6EFEA;color:#1F1512;font-family:'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;word-break:keep-all}
/* 콘텐츠 층: 흐린 지도 느낌 */
.bgl{position:absolute;inset:0;overflow:hidden}
.blob{position:absolute;border-radius:50%;filter:blur(90px)}
.roads{position:absolute;inset:0}
/* 유리 */
.glass{position:relative;background:rgba(255,255,255,0.78);-webkit-backdrop-filter:blur(28px) saturate(170%);backdrop-filter:blur(28px) saturate(170%);border:1px solid rgba(255,255,255,0.9);box-shadow:inset 0 1px 0 rgba(255,255,255,0.95),inset 0 -1px 0 rgba(0,0,0,0.08),0 24px 60px rgba(120,60,40,0.18)}
.glass::before{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;background:linear-gradient(160deg,rgba(255,255,255,0.22) 0%,rgba(255,255,255,0) 38%,rgba(255,255,255,0) 70%,rgba(255,255,255,0.08) 100%)}
.pill{border-radius:999px}
.card{border-radius:36px}
.top{position:absolute;left:40px;right:40px;top:28px;height:88px;display:flex;align-items:center;gap:16px}
.brand{height:88px;padding:0 28px 0 16px;display:flex;align-items:center;gap:16px;font-size:32px;font-weight:700}
.brand svg{border-radius:14px}
.loc{height:88px;padding:0 30px;display:flex;align-items:center;gap:14px;color:#6E5B53;font-size:26px}
.iconbtn{width:88px;height:88px;display:flex;align-items:center;justify-content:center;color:#1F1512}
.spacer{flex:1}
main{position:absolute;left:0;right:0;top:140px;bottom:0;display:grid;grid-template-columns:600px minmax(0,1fr);gap:48px;padding:16px 48px 48px;box-sizing:border-box}
.talk{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:40px}
.mic{width:360px;height:360px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;position:relative;
  background:radial-gradient(circle at 35% 30%,rgba(255,255,255,0.35),rgba(255,255,255,0) 45%),linear-gradient(160deg,rgba(255,255,255,0.18),rgba(255,255,255,0) 50%),#E4572E;
  box-shadow:inset 0 2px 0 rgba(255,255,255,0.55),inset 0 -14px 30px rgba(120,30,10,0.35),0 0 0 24px rgba(228,87,46,0.28),0 0 0 56px rgba(228,87,46,0.10),0 30px 70px rgba(228,87,46,0.40)}
.mic::after{content:"";position:absolute;inset:14px;border-radius:50%;border:1px solid rgba(255,255,255,0.35)}
.hint h2{margin:0;font-size:40px;font-weight:600;text-align:center}
.hint p{margin:14px 0 0;font-size:26px;line-height:1.5;color:#6E5B53;text-align:center}
.side{display:flex;flex-direction:column;justify-content:center;gap:24px;min-width:0}
.row{height:124px;padding:0 36px;display:flex;align-items:center;gap:24px;color:#1F1512;text-decoration:none;box-sizing:border-box}
.row .ib{width:68px;height:68px;border-radius:22px;background:rgba(255,255,255,0.95);display:flex;align-items:center;justify-content:center;flex:none;border:1px solid rgba(255,255,255,0.9)}
.row .tx{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}
.row .t{font-size:34px;font-weight:600}
.row .s{font-size:24px;color:#6E5B53}
.recent{padding:28px 36px 32px;display:flex;flex-direction:column;gap:18px;color:#1F1512;text-decoration:none;box-sizing:border-box}
.recent .meta{display:flex;align-items:center;justify-content:space-between;font-size:24px;color:#6E5B53}
.chip{display:inline-flex;align-items:center;height:48px;padding:0 20px;border-radius:24px;background:rgba(242,181,68,0.28);color:#8A5A00;font-size:22px;font-weight:600}
.recent .name{display:flex;align-items:center;gap:20px}
.recent .name b{font-size:38px;font-weight:700;flex:1}
.recent .name span{font-size:24px;color:#6E5B53}
.recent .note{font-size:24px;color:#9A867C}
</style></head><body>
<div class="root">
  <header class="top">
    <div class="glass pill brand"><svg xmlns="http://www.w3.org/2000/svg" width="56" height="56" viewBox="0 0 100 100"><rect width="100" height="100" rx="22" fill="#E4572E"/><path d="M50 90C50 90 20 60 20 41a30 30 0 1 1 60 0C80 60 50 90 50 90Z" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="4" stroke-linejoin="round"/><circle cx="50" cy="41" r="23" fill="#E4572E"/><g transform="translate(50 41) scale(0.62)"><path transform="rotate(38)" d="M0 -31C8.5 -31 12.5 -22 12.5 -13C12.5 -6.5 9.5 -2 6 0C4.4 0.9 3.3 1.8 3.2 3.4L3.8 27.5A3.8 3.8 0 0 1 -3.8 27.5L-3.2 3.4C-3.3 1.8 -4.4 0.9 -6 0C-9.5 -2 -12.5 -6.5 -12.5 -13C-12.5 -22 -8.5 -31 0 -31Z" fill="#FFFFFF"/><g transform="rotate(-38)" fill="none" stroke-linecap="round"><path d="M-3.75 -27.5v55M3.75 -27.5v55" stroke="#E4572E" stroke-width="11.25"/><path d="M-3.75 -27.5v55M3.75 -27.5v55" stroke="#FFFFFF" stroke-width="6.25"/></g></g></svg>
<span>다음에 가게</span></div>
    <div class="glass pill loc"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#B83A18" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m3 11 19-9-9 19-2-8Z"/></svg><span>강남대로 · 북쪽</span></div>
    <div class="spacer"></div>
    <button type="button" aria-label="설정" class="glass pill iconbtn" style="border:1px solid rgba(255,255,255,0.9);cursor:pointer"><svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="#1F1512" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1Z"/></svg></button>
  </header>

  <main>
    <section class="talk" aria-label="말하기">
      <button type="button" aria-label="눌러서 말하기" class="mic" style="border:0;cursor:pointer"><svg width="168" height="168" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 15a4 4 0 0 0 4-4V6a4 4 0 1 0-8 0v5a4 4 0 0 0 4 4Z"/><path d="M19 11a7 7 0 0 1-14 0"/><path d="M12 18v3"/></svg></button>
      <div class="hint"><h2>눌러서 말하기</h2><p>“방금 지난 가게 저장해줘”<br>“뭐 먹을까”</p></div>
    </section>
    <section class="side" aria-label="바로가기">
      <a href="#" class="glass card row"><span class="ib"><svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="#B83A18" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 2v7c0 1.1.9 2 2 2h4a2 2 0 0 0 2-2V2"/><path d="M7 2v20"/><path d="M21 15V2a5 5 0 0 0-5 5v6c0 1.1.9 2 2 2h3Zm0 0v7"/></svg></span><span class="tx"><span class="t">뭐 먹을까</span><span class="s">근처 저장 가게 중 3곳 추천</span></span><svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#9A867C" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 5 7 7-7 7"/></svg></a>
      <a href="#" class="glass card row"><span class="ib"><svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="#B83A18" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z"/><circle cx="12" cy="10" r="3"/></svg></span><span class="tx"><span class="t">내 맛집</span><span class="s">12곳 · 미확인 3곳</span></span><svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#9A867C" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 5 7 7-7 7"/></svg></a>
      <a href="#" class="glass card recent" aria-label="최근 저장 서울갈비">
        <span class="meta"><span>최근 저장 · 어제 18:42</span><span class="chip">미확인</span></span>
        <span class="name"><b>서울갈비</b><span>고깃집 · 1.2km</span></span>
        <span class="note">멈추면 어느 가게인지 확인해 주세요</span>
      </a>
    </section>
  </main>
</div>
</body></html>
